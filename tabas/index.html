<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabas — Acesso Restrito</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Texto escondido de fundo (quase invisível) -->
  <div class="bg-text" aria-hidden="true" id="bgText"></div>

  <button class="sound-toggle" id="soundToggle" title="Alternar som">♪</button>

  <div class="container">
    <h1>Tabas</h1>
    <div class="subtitle">O que eu sou?</div>

    <div class="instruction">pronuncie a palavra</div>
    <input 
      type="text" 
      id="codeInput" 
      autocomplete="off" 
      spellcheck="false" 
      autofocus
    >
    <div class="message" id="message">Acesso negado</div>
  </div>

  <div class="granted" id="granted">
    <span>Acesso Concedido</span>
  </div>

  <!-- 🎵 Substitua "musica.mp3" pelo nome do seu arquivo -->

  <audio id="bgMusic" src="Vince Guaraldi Trio - Christmas Time Is Here (Vocal).mp3.ext" loop>

  <script src="audio.js"></script>
  <script src="script.js"></script>
</body>
</html>
